  <!-- bitplanet text - mono color -->
  <text x="100" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#ffffff">
    bitplanet
  </text>
  <!-- GAMES text -->
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">GAMES</text>
</svg>
