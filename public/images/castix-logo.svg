<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Abstract symbol - three interconnected rounded shapes meeting at center - mono color -->
  <g transform="translate(100, 30)">
    <!-- Central point -->
    <circle cx="0" cy="0" r="3" fill="#ffffff"/>
    <!-- Three arms with rounded ends -->
    <path d="M 0 0 L -18 -15" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-18" cy="-15" r="4" fill="#ffffff"/>
    <path d="M 0 0 L 18 -15" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="18" cy="-15" r="4" fill="#ffffff"/>
    <path d="M 0 0 L 0 18" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="18" r="4" fill="#ffffff"/>
  </g>
  <text x="100" y="65" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CASTIX</text>
</svg>
