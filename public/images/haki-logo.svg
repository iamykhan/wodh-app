<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- HAKI logo - Greek key/meander pattern symbol + text - mono color -->
  <!-- Greek key pattern - square spiral -->
  <g transform="translate(10, 8)">
    <!-- Outer border - square with opening -->
    <path d="M 0 0 L 55 0 L 55 64 L 0 64 L 0 10" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="miter"/>
    <!-- Inner spiral - continuing inward -->
    <path d="M 10 10 L 10 54 L 45 54 L 45 10 L 20 10 L 20 44 L 35 44 L 35 20 L 28 20 L 28 34" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="miter"/>
  </g>
  <!-- HAKI text with registered trademark -->
  <text x="135" y="45" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">HAKI</text>
  <text x="170" y="26" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">®</text>
</svg>
