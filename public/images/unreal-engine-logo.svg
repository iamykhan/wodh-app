<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" width="200" height="80">
  <!-- Unreal Engine logo - circular emblem with gothic U/trident - mono color -->
  <!-- Outer circle with brush stroke effect -->
  <circle cx="100" cy="26" r="22" fill="none" stroke="#ffffff" stroke-width="4"/>
  <!-- Gothic U/Trident shape - solid filled -->
  <!-- Left arm with curved horn at top -->
  <path d="M 80 6
           C 77 4, 74 3, 71 4
           C 74 5, 76 7, 78 10
           C 80 14, 80 18, 80 22
           L 80 38
           C 80 44, 85 48, 92 50
           L 100 52
           L 84 52
           C 78 50, 76 44, 76 38
           L 76 22
           C 76 16, 78 12, 80 6
           Z" 
        fill="#ffffff"/>
  <!-- Right arm with curved horn at top -->
  <path d="M 120 6
           C 123 4, 126 3, 129 4
           C 126 5, 124 7, 122 10
           C 120 14, 120 18, 120 22
           L 120 38
           C 120 44, 115 48, 108 50
           L 100 52
           L 116 52
           C 122 50, 124 44, 124 38
           L 124 22
           C 124 16, 122 12, 120 6
           Z" 
        fill="#ffffff"/>
  <!-- Center vertical element -->
  <rect x="97" y="16" width="6" height="28" fill="#ffffff"/>
  <!-- Bottom curve connecting the arms -->
  <ellipse cx="100" cy="50" rx="16" ry="6" fill="#ffffff"/>
  <!-- UNREAL text -->
  <text x="100" y="58" font-family="Arial Black, Arial, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">UNREAL</text>
  <!-- ENGINE text -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">ENGINE</text>
</svg>
